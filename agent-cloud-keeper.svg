<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 380 250" role="img" aria-labelledby="title desc">
  <title id="title">云朵小管家</title>
  <desc id="desc">扁圆浅蓝云朵幽灵，戴着细框眼镜，右下佩戴明显的加粗对勾勋章。</desc>
  <defs>
    <linearGradient id="cloud" x1="0" y1="0" x2=".8" y2="1">
      <stop stop-color="#EAF6F8"/><stop offset="1" stop-color="#C9E0E5"/>
    </linearGradient>
    <filter id="soft-shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="8" stdDeviation="7" flood-color="#465A61" flood-opacity=".18"/>
    </filter>
  </defs>

  <!-- Same flattened, soft ghost-cloud silhouette as the selected concept -->
  <g filter="url(#soft-shadow)">
    <path d="M95 128c0-47 35-85 84-85 49 0 84 35 84 81 14 10 22 27 22 45 0 24-15 42-38 47-7 19-21 28-39 28-15 0-25-7-34-19-10 15-25 23-43 23-17 0-31-8-41-21-9 10-20 15-33 13-16-2-27-13-27-28 0-13 9-24 24-28-6-8-9-18-9-29 0-13 5-22 13-27Z" fill="url(#cloud)" stroke="#B8D3D9" stroke-width="3" stroke-linejoin="round"/>
    <path d="M111 91c10-22 30-35 55-38" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity=".8"/>
  </g>

  <!-- Gentle, slightly shy eyes -->
  <ellipse cx="174" cy="109" rx="6.5" ry="9" fill="#303042"/>
  <ellipse cx="207" cy="109" rx="6.5" ry="9" fill="#303042"/>
  <ellipse cx="176" cy="106" rx="2" ry="2.5" fill="#FFFFFF"/>
  <ellipse cx="209" cy="106" rx="2" ry="2.5" fill="#FFFFFF"/>

  <!-- Thin, open glasses; the bridge sits only between the lenses -->
  <g fill="#FFFFFF" fill-opacity=".16" stroke="#53636B" stroke-width="2.6">
    <rect x="147" y="102" width="35" height="27" rx="12"/>
    <rect x="198" y="102" width="35" height="27" rx="12"/>
  </g>
  <path d="M182 111c5-5 11-5 16 0" fill="none" stroke="#53636B" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M147 109l-7-3m86 3 7-3" fill="none" stroke="#53636B" stroke-width="2.4" stroke-linecap="round"/>
  <ellipse cx="132" cy="134" rx="10" ry="5" fill="#F49DA1" opacity=".48"/>
  <ellipse cx="258" cy="134" rx="10" ry="5" fill="#F49DA1" opacity=".48"/>
  <path d="M184 139c4 4 8 4 12 0" fill="none" stroke="#424052" stroke-width="2" stroke-linecap="round"/>

  <!-- Clearly visible badge on the lower-right side, away from the face -->
  <g transform="translate(273 164)">
    <circle r="16" fill="#FFFFFF" stroke="#D7C47D" stroke-width="2"/>
    <path d="m-7 0 5 5 10-11" fill="none" stroke="#39776E" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
  <path d="m78 91 3 8 8 3-8 3-3 8-3-8-8-3 8-3z" fill="#E8B84F"/>
</svg>
