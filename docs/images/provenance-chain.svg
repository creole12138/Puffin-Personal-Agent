<svg xmlns="http://www.w3.org/2000/svg" width="450" height="94" viewBox="0 0 720 150" role="img" aria-labelledby="title desc">
  <title id="title">Puffin 决策来源链</title>
  <desc id="desc">决策关联到前提，前提关联到证据，证据关联到原始材料。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#f7faf8"/>
    </linearGradient>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#7890a3"/>
    </marker>
  </defs>
  <rect width="720" height="150" rx="18" fill="url(#bg)"/>
  <text x="360" y="27" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="18" fill="#6a7f90">每个重要结论，都能沿来源链追溯</text>
  <g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <rect x="28" y="58" width="132" height="52" rx="12" fill="#eaf0fb" stroke="#9db5df" stroke-width="1.5"/>
    <text x="94" y="90" font-size="22" font-weight="700" fill="#35588b">决策</text>
    <rect x="204" y="58" width="132" height="52" rx="12" fill="#e8f4f1" stroke="#8cc5b9" stroke-width="1.5"/>
    <text x="270" y="90" font-size="22" font-weight="700" fill="#245b56">前提</text>
    <rect x="380" y="58" width="132" height="52" rx="12" fill="#fff8e8" stroke="#e4c77c" stroke-width="1.5"/>
    <text x="446" y="90" font-size="22" font-weight="700" fill="#765a20">证据</text>
    <rect x="556" y="58" width="136" height="52" rx="12" fill="#fff" stroke="#b9cbd7" stroke-width="1.5"/>
    <text x="624" y="90" font-size="22" font-weight="700" fill="#29465c">原始材料</text>
  </g>
  <g stroke="#7890a3" stroke-width="2" fill="none" marker-end="url(#arrow)">
    <path d="M160 84 H198"/><path d="M336 84 H374"/><path d="M512 84 H550"/>
  </g>
</svg>
