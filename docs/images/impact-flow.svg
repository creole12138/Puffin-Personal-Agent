<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="250" viewBox="0 0 1100 250" role="img" aria-labelledby="title desc">
  <title id="title">Puffin 前提变化影响分析流程</title>
  <desc id="desc">从新证据出现，到判断前提变化、评估决策、传播影响、分类处理，最后更新状态并展示给用户。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fbff"/>
      <stop offset="1" stop-color="#f5f8f5"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#1e3650" flood-opacity=".12"/>
    </filter>
    <marker id="arrow" markerWidth="9" markerHeight="9" refX="7" refY="4.5" orient="auto">
      <path d="M0 0 L9 4.5 L0 9 Z" fill="#7590a4"/>
    </marker>
  </defs>
  <rect width="1100" height="250" rx="22" fill="url(#bg)"/>
  <text x="550" y="38" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="19" font-weight="700" fill="#20384d">前提变化 → 影响分析</text>
  <text x="550" y="62" text-anchor="middle" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" font-size="12" fill="#6c8191">Puffin 不只提示变化，也解释变化会影响什么</text>

  <g filter="url(#shadow)" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" text-anchor="middle">
    <rect x="24" y="102" width="157" height="68" rx="14" fill="#e8f4f1" stroke="#8cc5b9" stroke-width="2"/>
    <text x="102.5" y="132" font-size="15" font-weight="700" fill="#245b56">1 新证据出现</text>
    <text x="102.5" y="153" font-size="11" fill="#4c7771">预算表更新</text>

    <rect x="203" y="102" width="157" height="68" rx="14" fill="#fff" stroke="#b9cbd7" stroke-width="2"/>
    <text x="281.5" y="132" font-size="15" font-weight="700" fill="#29465c">2 判断前提</text>
    <text x="281.5" y="153" font-size="11" fill="#617786">是否发生变化</text>

    <rect x="382" y="102" width="157" height="68" rx="14" fill="#fff" stroke="#b9cbd7" stroke-width="2"/>
    <text x="460.5" y="132" font-size="15" font-weight="700" fill="#29465c">3 评估决策</text>
    <text x="460.5" y="153" font-size="11" fill="#617786">检查直接依赖</text>

    <rect x="561" y="102" width="157" height="68" rx="14" fill="#fff" stroke="#b9cbd7" stroke-width="2"/>
    <text x="639.5" y="132" font-size="15" font-weight="700" fill="#29465c">4 传播影响</text>
    <text x="639.5" y="153" font-size="11" fill="#617786">沿依赖关系查找</text>

    <rect x="740" y="102" width="157" height="68" rx="14" fill="#fff8e8" stroke="#e4c77c" stroke-width="2"/>
    <text x="818.5" y="132" font-size="15" font-weight="700" fill="#765a20">5 分类处理</text>
    <text x="818.5" y="153" font-size="11" fill="#8a713a">自动更新或请确认</text>

    <rect x="919" y="102" width="157" height="68" rx="14" fill="#eaf0fb" stroke="#9db5df" stroke-width="2"/>
    <text x="997.5" y="132" font-size="15" font-weight="700" fill="#35588b">6 更新并展示</text>
    <text x="997.5" y="153" font-size="11" fill="#607ba5">状态、事件、结果</text>
  </g>

  <g stroke="#7590a4" stroke-width="2.2" fill="none" marker-end="url(#arrow)">
    <path d="M181 136 H198"/><path d="M360 136 H377"/><path d="M539 136 H556"/><path d="M718 136 H735"/><path d="M897 136 H914"/>
  </g>
</svg>
